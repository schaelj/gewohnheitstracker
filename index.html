<title>Gewohnheiten</title>
<style>
  :root{
    --paper:#F7F3EA;
    --paper-raised:#FFFFFF;
    --ink:#262420;
    --ink-soft:#5B5648;
    --stone:#A39C87;
    --line:#E7E0CD;
    --line-strong:#D9CFB6;
    --moss:#3C5A44;
    --moss-tint:#E3E9DE;
    --clay:#A6503E;
    --clay-tint:#F1DFDA;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#DCD5C0;font-family:var(--sans);}
  body{display:flex;justify-content:center;}
  #app{
    width:100%;max-width:430px;
    height:100vh;height:100dvh;
    background:var(--paper);color:var(--ink);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 70px rgba(0,0,0,0.10);
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--moss);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
  }

  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-top) + 22px) 20px 110px;}
  .screen.hidden{display:none;}

  .greeting{font-size:14px;color:var(--stone);margin-bottom:2px;font-weight:500;}
  .date-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .date-title{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:-0.2px;}
  .date-sub{font-size:12.5px;color:var(--stone);margin-bottom:14px;}
  .date-nav{display:flex;gap:6px;}
  .date-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--paper-raised);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .date-nav button:disabled{opacity:0.28;}
  .date-nav button:active:not(:disabled){background:var(--moss-tint);}

  .progress-wrap{margin:16px 0 24px;}
  .progress-bar{height:6px;border-radius:99px;background:var(--line-strong);overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:var(--moss);border-radius:99px;transition:width .35s ease;}
  .progress-label{font-size:13px;color:var(--ink-soft);}
  .progress-label .serif-num{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);}

  .habit-list{display:flex;flex-direction:column;}
  .habit-row{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line);}
  .habit-row:last-child{border-bottom:none;}
  .habit-group{padding:15px 2px;border-bottom:1px solid var(--line);}
  .habit-group:last-child{border-bottom:none;}
  .group-header{display:flex;align-items:center;gap:14px;}

  .check-circle{width:32px;height:32px;min-width:32px;border-radius:50%;border:2px solid var(--c,var(--moss));display:flex;align-items:center;justify-content:center;background:transparent;padding:0;transition:transform .12s ease,background .15s ease;}
  .check-circle:active{transform:scale(0.86);}
  .check-circle svg{opacity:0;transform:scale(.5);transition:opacity .15s ease,transform .15s ease;}
  .check-circle.done{background:var(--c,var(--moss));animation:stampIn .3s cubic-bezier(.34,1.56,.64,1);}
  .check-circle.done svg{opacity:1;transform:scale(1);}
  @keyframes stampIn{0%{transform:scale(1.45);opacity:.35;}60%{transform:scale(.9);}100%{transform:scale(1);opacity:1;}}

  .habit-info{flex:1;min-width:0;}
  .habit-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit-name-line{display:flex;align-items:baseline;gap:7px;margin-bottom:2px;}
  .habit-name-line .habit-name{min-width:0;}
  .group-fraction{flex-shrink:0;font-size:12.5px;color:var(--stone);font-weight:600;}
  .habit-interval{font-size:12px;color:var(--stone);}
  .habit-streak{text-align:right;min-width:32px;}
  .habit-streak .num{display:block;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.1;}
  .habit-streak .cap{display:block;font-size:9.5px;color:var(--stone);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}

  .sub-rows{margin-left:46px;margin-top:10px;display:flex;flex-direction:column;gap:11px;}
  .sub-row{display:flex;align-items:center;gap:12px;}
  .sub-check{width:22px;height:22px;min-width:22px;border-radius:50%;border:1.8px solid var(--c,var(--moss));display:flex;align-items:center;justify-content:center;background:transparent;padding:0;transition:transform .12s ease,background .15s ease;}
  .sub-check:active{transform:scale(0.86);}
  .sub-check svg{opacity:0;transform:scale(.5);transition:opacity .15s ease,transform .15s ease;}
  .sub-check.done{background:var(--c,var(--moss));}

  .sub-name{font-size:14px;color:var(--ink-soft);}

  .empty-state{text-align:center;padding:64px 12px;color:var(--ink-soft);}

  .empty-state p{font-size:14px;line-height:1.55;margin:0;color:var(--ink-soft);}

  .loading{text-align:center;padding:100px 20px;color:var(--stone);font-size:14px;}

  .fab{position:absolute;right:20px;bottom:calc(var(--safe-bottom) + 76px);width:54px;height:54px;border-radius:50%;background:var(--moss);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(60,90,68,0.38);z-index:20;}

  .tabbar{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(247,243,234,0.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);z-index:10;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--stone);background:none;border:none;}

  .summary-row{display:flex;gap:10px;margin-bottom:22px;}

  .summary-box .n{font-family:var(--serif);font-size:21px;font-weight:600;}

  .habit-card{background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:20px;padding:18px;margin-bottom:14px;}
  .habit-card-head{display:flex;align-items:center;gap:9px;margin-bottom:15px;}

  .stat .n{font-family:var(--serif);font-size:19px;font-weight:600;}
  .stat .l{font-size:10.5px;color:var(--stone);margin-top:1px;}
  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .heat-cell{aspect-ratio:1;border-radius:50%;background:var(--line);}
  .heat-cell.done{background:var(--c);}
  .heat-cell.missed{background:var(--clay-tint);}
  .heat-cell.pending{border:1.5px solid var(--c);background:transparent;}

  .sub-breakdown{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .sub-breakdown-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft);gap:10px;}
  .sub-breakdown-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

  .reset-zone{text-align:center;margin-top:8px;padding-bottom:8px;}
  .data-links{display:flex;justify-content:center;gap:20px;margin-bottom:6px;}
  .link-neutral{background:none;border:none;color:var(--moss);font-size:12px;text-decoration:underline;padding:8px;font-weight:600;}
  .link-danger{background:none;border:none;color:var(--stone);font-size:12px;text-decoration:underline;padding:8px;}
  .delete-warning{font-size:13px;color:var(--ink-soft);text-align:center;margin:0 0 12px;line-height:1.5;}

  .overlay{position:fixed;inset:0;background:rgba(38,36,32,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}

  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:5px;background:var(--line-strong);border-radius:3px;margin:8px auto 16px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}

  .text-input{width:100%;border:none;border-bottom:1.5px solid var(--line-strong);background:transparent;padding:6px 2px 11px;font-size:17px;color:var(--ink);margin-bottom:20px;}
  .text-input:focus{outline:none;border-color:var(--moss);}

  .swatches{display:flex;gap:12px;margin-bottom:20px;}
  .swatch{width:32px;height:32px;border-radius:50%;background:var(--c);border:none;padding:0;}
  .swatch.selected{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c);}

  .segmented{display:flex;background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:14px;padding:3px;gap:2px;margin-bottom:18px;}
  .seg-btn{flex:1;border:none;background:transparent;padding:9px 2px;font-size:11.5px;font-weight:600;color:var(--ink-soft);border-radius:11px;}
  .seg-btn.active{background:var(--moss);color:var(--paper);}

  .field-hint{font-size:13px;color:var(--stone);margin:-6px 0 20px;}
  .weekday-pills{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap;}

  .pill.active{background:var(--moss);border-color:var(--moss);color:var(--paper);}

  .number-field{display:flex;align-items:center;gap:9px;margin-bottom:20px;font-size:15px;color:var(--ink);}
  .number-field input{width:56px;text-align:center;border:none;border-bottom:1.5px solid var(--line-strong);background:transparent;font-size:16px;padding:6px 0;font-family:var(--serif);color:var(--ink);font-weight:600;}
  .number-field input:focus{outline:none;border-color:var(--moss);}

  .sub-section{margin-bottom:20px;}
  .sub-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .sub-chip{display:flex;align-items:center;justify-content:space-between;background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:12px;padding:10px 8px 10px 14px;font-size:14px;color:var(--ink);gap:8px;}
  .sub-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sub-chip button{background:none;border:none;color:var(--stone);font-size:19px;line-height:1;padding:4px 8px;flex-shrink:0;}
  .sub-add-row{display:flex;gap:8px;align-items:center;}
  .sub-add-row .text-input{margin-bottom:0;flex:1;font-size:15px;}
  .add-sub-btn{width:38px;height:38px;min-width:38px;border-radius:50%;border:none;background:var(--moss);color:var(--paper);font-size:19px;display:flex;align-items:center;justify-content:center;padding:0;}

  .sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btn-primary,.btn-danger,.btn-secondary{border:none;border-radius:14px;padding:15px;font-size:15.5px;font-weight:600;width:100%;}
  .btn-primary{background:var(--moss);color:var(--paper);}
  .btn-primary:active{opacity:0.85;}
  .btn-danger{background:var(--clay-tint);color:var(--clay);}
  .btn-danger.small,.btn-secondary.small{padding:11px;font-size:14px;}
  .btn-secondary{background:var(--line);color:var(--ink-soft);}

  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  .shake{animation:shake .35s ease;}
</style>
</head>
<body>
<div id="app">
  <div id="today-screen" class="screen"><div class="loading">Wird geladen …</div></div>
  <div id="dashboard-screen" class="screen hidden"></div>

  <button class="fab" id="fabBtn" onclick="openHabitSheet()" aria-label="Neue Gewohnheit">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#F7F3EA" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <div class="tabbar">
    <button class="tab active" id="tabToday" onclick="switchView('today')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.8"/><path d="M8.3 12.3l2.3 2.3L15.9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Heute</span>
    </button>
    <button class="tab" id="tabDash" onclick="switchView('dashboard')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4.5 19V11M12 19V5M19.5 19v-6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Übersicht</span>
    </button>
  </div>

  <div class="overlay" id="sheetOverlay">
    <div class="sheet" id="habitSheet"></div>
  </div>
</div>

<script>
/* ---------- Konstanten ---------- */
const HABIT_COLORS = ['#3C5A44','#3D5A78','#7A3B42','#A67C3D','#6B4A6E','#4F5D63'];
const INTERVAL_TYPES = [
  {key:'daily', label:'Täglich'},
  {key:'weekdays', label:'Wochentage'},
  {key:'everyNDays', label:'Alle X Tage'},
  {key:'timesPerWeek', label:'X / Woche'},
];
const WEEKDAY_NAME = {1:'Mo',2:'Di',3:'Mi',4:'Do',5:'Fr',6:'Sa',0:'So'};
const WD_FULL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const STORAGE_KEY = 'tracker-data';
const ICON_CHECK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 13l5 6L20 5" stroke="#FBF8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_CHECK_SM = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M4 13l5 6L20 5" stroke="#FBF8F0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_CLOSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ICON_CHEV_L = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_CHEV_R = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- Status ---------- */
let state = { habits: [], completions: {} };
let currentView = 'today';
let selectedDate = todayISO();
let editingHabitId = null;
let formHabit = null;
let deleteConfirmPending = false;
let resetConfirmPending = false;
let importPendingData = null;
let importError = '';

/* ---------- Datumshilfen ---------- */
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return toISO(dt); }
function dayOfWeek(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).getDay(); }
function daysBetween(iso1,iso2){ const [y1,m1,d1]=iso1.split('-').map(Number); const [y2,m2,d2]=iso2.split('-').map(Number); return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000); }
function getMonday(iso){ const dow=dayOfWeek(iso); const diff=(dow===0)?-6:(1-dow); return addDays(iso,diff); }
function formatDateDisplay(iso){ const [y,m,d]=iso.split('-').map(Number); return `${WD_FULL[dayOfWeek(iso)]}, ${d}. ${MONTHS[m-1]}`; }
function formatDateShort(iso){ const [y,m,d]=iso.split('-').map(Number); return `${d}. ${MONTHS[m-1]}`; }
function getGreeting(){ const h=new Date().getHours(); if(h<5)return'Guten Abend'; if(h<11)return'Guten Morgen'; if(h<17)return'Guten Tag'; if(h<22)return'Guten Abend'; return'Gute Nacht'; }

/* ---------- Untergewohnheiten: Hilfsfunktionen ---------- */
function hasSubHabits(h){ return !!(h.subHabits && h.subHabits.length>0); }
function isSubCompleted(subId, iso){ return (state.completions[subId]||[]).includes(iso); }
function activeSubsFor(h, iso){ return h.subHabits.filter(s=>s.createdDate<=iso); }
// Virtuelle Einzel-Gewohnheit: teilt sich den Rhythmus der Hauptgewohnheit, hat aber eigenes Erstellungsdatum & eigene Häkchen
function virtualSubHabit(parent, sub){
  return { id:sub.id, intervalType:parent.intervalType, weekdays:parent.weekdays, everyNDays:parent.everyNDays, timesPerWeek:parent.timesPerWeek, createdDate:sub.createdDate, subHabits:null };
}

/* ---------- Terminierung & Streaks (Kernlogik getestet) ---------- */
function isScheduled(habit, iso){
  if (iso < habit.createdDate) return false;
  switch(habit.intervalType){
    case 'daily': return true;
    case 'weekdays': return habit.weekdays.includes(dayOfWeek(iso));
    case 'everyNDays': return daysBetween(habit.createdDate, iso) % habit.everyNDays === 0;
    case 'timesPerWeek': return true;
  }
}
function isCompleted(habit, iso){
  if (hasSubHabits(habit)){
    const active = activeSubsFor(habit, iso);
    if (active.length===0) return false;
    return active.every(s=>isSubCompleted(s.id, iso));
  }
  return (state.completions[habit.id]||[]).includes(iso);
}

function getCurrentStreak(habit, today){
  if (habit.intervalType==='timesPerWeek') return getCurrentStreakWeekly(habit, today);
  let cursor = today, streak=0, iter=0;
  if (isScheduled(habit,cursor) && !isCompleted(habit,cursor)) cursor = addDays(cursor,-1);
  while (cursor >= habit.createdDate && iter < 3660){
    iter++;
    if (isScheduled(habit,cursor)){
      if (isCompleted(habit,cursor)){ streak++; cursor=addDays(cursor,-1); }
      else break;
    } else cursor = addDays(cursor,-1);
  }
  return streak;
}
function getLongestStreak(habit, today){
  if (habit.intervalType==='timesPerWeek') return getLongestStreakWeekly(habit, today);
  let cursor=habit.createdDate, max=0, cur=0, iter=0;
  while (cursor<=today && iter<3660){
    iter++;
    if (isScheduled(habit,cursor)){
      if (isCompleted(habit,cursor)){ cur++; if(cur>max)max=cur; }
      else cur=0;
    }
    cursor=addDays(cursor,1);
  }
  return max;
}
function countCompletionsInWeek(habit, mondayISO, today){
  let c=0;
  for(let i=0;i<7;i++){ const d=addDays(mondayISO,i); if(d>today) break; if(isCompleted(habit,d)) c++; }
  return c;
}
function getCurrentStreakWeekly(habit, today){
  const target=habit.timesPerWeek; let mon=getMonday(today); let streak=0, iter=0;
  let count=countCompletionsInWeek(habit,mon,today);
  if (count>=target){ streak++; mon=addDays(mon,-7); } else { mon=addDays(mon,-7); }
  while (mon>=getMonday(habit.createdDate) && iter<520){
    iter++;
    count=countCompletionsInWeek(habit,mon,today);
    if (count>=target){ streak++; mon=addDays(mon,-7); } else break;
  }
  return streak;
}
function getLongestStreakWeekly(habit, today){
  const target=habit.timesPerWeek; let mon=getMonday(habit.createdDate); const lastMon=getMonday(today);
  let max=0,cur=0,iter=0;
  while (mon<=lastMon && iter<520){
    iter++;
    const count=countCompletionsInWeek(habit,mon,today);
    const isCurrent=(mon===lastMon);
    if (count>=target){ cur++; if(cur>max)max=cur; } else if(!isCurrent){ cur=0; }
    mon=addDays(mon,7);
  }
  return max;
}
function getCompletionRate(habit, days){
  const today=todayISO();
  if (habit.intervalType==='timesPerWeek'){
    const start=addDays(today,-(days-1)); let done=0;
    for(let iso=start; iso<=today; iso=addDays(iso,1)) if(isCompleted(habit,iso)) done++;
    const targetTotal = habit.timesPerWeek*(days/7);
    return targetTotal===0?0:Math.min(100, Math.round((done/targetTotal)*100));
  } else {
    let scheduled=0, done=0; let cursor=addDays(today,-(days-1));
    if (cursor<habit.createdDate) cursor=habit.createdDate;
    for(; cursor<=today; cursor=addDays(cursor,1)){
      if (isScheduled(habit,cursor)){ scheduled++; if(isCompleted(habit,cursor)) done++; }
    }
    return scheduled===0?0:Math.round((done/scheduled)*100);
  }
}
function getHeatmapData(habit, days, today){
  const arr=[]; let cursor=addDays(today,-(days-1));
  for(let i=0;i<days;i++){
    let status='none';
    if (cursor>=habit.createdDate){
      const sched=isScheduled(habit,cursor); const done=isCompleted(habit,cursor);
      if (sched && done) status='done';
      else if (sched && !done && cursor<today) status='missed';
      else if (sched && !done && cursor===today) status='pending';
    }
    arr.push(status); cursor=addDays(cursor,1);
  }
  return arr;
}
function intervalLabel(h){
  switch(h.intervalType){
    case 'daily': return 'Täglich';
    case 'weekdays': { const order=[1,2,3,4,5,6,0]; return order.filter(d=>h.weekdays.includes(d)).map(d=>WEEKDAY_NAME[d]).join(', ') || 'Keine Tage'; }
    case 'everyNDays': return `Alle ${h.everyNDays} Tage`;
    case 'timesPerWeek': return `${h.timesPerWeek}x pro Woche`;
  }
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* ---------- Speicher ---------- */
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      state.habits = parsed.habits || [];
      state.completions = parsed.completions || {};
    }
  } catch(e){ console.error('Laden fehlgeschlagen', e); }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Speichern fehlgeschlagen (Speicher evtl. voll oder deaktiviert)', e); }
}

/* ---------- Rendering: Heute ---------- */
function getScheduledHabitsFor(iso){
  return state.habits.filter(h=>{
    if (!isScheduled(h, iso)) return false;
    if (hasSubHabits(h)) return activeSubsFor(h, iso).length>0;
    return true;
  });
}
function renderToday(){
  const el = document.getElementById('today-screen');
  const today = todayISO();
  const isToday = selectedDate === today;
  const canGoNext = selectedDate < today;
  const todaysHabits = getScheduledHabitsFor(selectedDate);
  const doneCount = todaysHabits.filter(h => isCompleted(h, selectedDate)).length;
  const total = todaysHabits.length;
  const pct = total===0 ? 0 : Math.round((doneCount/total)*100);

  let html = `
    <div class="greeting">${getGreeting()}</div>
    <div class="date-row">
      <div class="date-title">${isToday ? 'Heute' : formatDateShort(selectedDate)}</div>
      <div class="date-nav">
        <button onclick="navDate(-1)" aria-label="Vorheriger Tag">${ICON_CHEV_L}</button>
        <button onclick="navDate(1)" ${canGoNext?'':'disabled'} aria-label="Nächster Tag">${ICON_CHEV_R}</button>
      </div>
    </div>
    ${!isToday ? `<div class="date-sub">${formatDateDisplay(selectedDate)}</div>` : ''}
  `;

  if (total>0){
    html += `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:${pct}%"></div></div>
      <div class="progress-label" id="progressLabel"><span class="serif-num">${doneCount}</span>/${total} erledigt</div>
    </div>`;
  }

  if (todaysHabits.length===0){
    html += state.habits.length===0 ? `
      <div class="empty-state">
        <h3>Noch keine Gewohnheiten</h3>
        <p>Leg mit dem Plus-Button unten deine erste Gewohnheit an – Name und Rhythmus bestimmst du selbst.</p>
      </div>` : `
      <div class="empty-state">
        <h3>Nichts geplant</h3>
        <p>Für ${isToday?'heute':'diesen Tag'} steht laut deinem Rhythmus keine Gewohnheit an.</p>
      </div>`;
  } else {
    html += `<div class="habit-list">`;
    todaysHabits.forEach(h=>{ html += hasSubHabits(h) ? renderGroupRow(h) : renderSimpleRow(h); });
    html += `</div>`;
  }
  el.innerHTML = html;
}

function renderSimpleRow(h){
  const isToday = selectedDate === todayISO();
  const done = isCompleted(h, selectedDate);
  const streak = isToday ? getCurrentStreak(h, todayISO()) : null;
  return `
    <div class="habit-row">
      <button class="check-circle ${done?'done':''}" style="--c:${h.color}" onclick="toggleDone('${h.id}', this)" aria-label="${escapeAttr(h.name)} abhaken">${ICON_CHECK}</button>
      <div class="habit-info" onclick="openHabitSheet('${h.id}')">
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="habit-interval">${intervalLabel(h)}</div>
      </div>
      ${isToday ? `<div class="habit-streak"><span class="num">${streak}</span><span class="cap">Tage</span></div>` : ''}
    </div>`;
}
function renderGroupRow(h){
  const isToday = selectedDate === todayISO();
  const active = activeSubsFor(h, selectedDate);
  const doneCount = active.filter(s=>isSubCompleted(s.id, selectedDate)).length;
  const allDone = active.length>0 && doneCount===active.length;
  const streak = isToday ? getCurrentStreak(h, todayISO()) : null;
  return `
    <div class="habit-group">
      <div class="group-header">
        <button class="check-circle ${allDone?'done':''}" style="--c:${h.color}" onclick="toggleGroupAll('${h.id}', this)" aria-label="${escapeAttr(h.name)} alle abhaken">${ICON_CHECK}</button>
        <div class="habit-info" onclick="openHabitSheet('${h.id}')">
          <div class="habit-name-line"><span class="habit-name">${escapeHtml(h.name)}</span><span class="group-fraction">${doneCount}/${active.length}</span></div>
          <div class="habit-interval">${intervalLabel(h)}</div>
        </div>
        ${isToday ? `<div class="habit-streak"><span class="num">${streak}</span><span class="cap">Tage</span></div>` : ''}
      </div>
      <div class="sub-rows">
        ${active.map(s=>{
          const done = isSubCompleted(s.id, selectedDate);
          return `<div class="sub-row">
            <button class="sub-check ${done?'done':''}" style="--c:${h.color}" onclick="toggleSubDone('${s.id}', this, '${h.id}')" aria-label="${escapeAttr(s.name)} abhaken">${ICON_CHECK_SM}</button>
            <span class="sub-name">${escapeHtml(s.name)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function updateProgressIndicator(){
  const todaysHabits = getScheduledHabitsFor(selectedDate);
  const doneCount = todaysHabits.filter(h => isCompleted(h, selectedDate)).length;
  const total = todaysHabits.length;
  const pct = total===0 ? 0 : Math.round((doneCount/total)*100);
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if (fill) fill.style.width = pct+'%';
  if (label) label.innerHTML = `<span class="serif-num">${doneCount}</span>/${total} erledigt`;
}

async function toggleDone(habitId, btnEl){
  if (!state.completions[habitId]) state.completions[habitId]=[];
  const idx = state.completions[habitId].indexOf(selectedDate);
  const willBeDone = idx===-1;
  if (willBeDone) state.completions[habitId].push(selectedDate);
  else state.completions[habitId].splice(idx,1);

  btnEl.classList.toggle('done', willBeDone);
  const row = btnEl.closest('.habit-row');
  if (row){
    const habit = state.habits.find(h=>h.id===habitId);
    const streakEl = row.querySelector('.habit-streak .num');
    if (streakEl && habit) streakEl.textContent = getCurrentStreak(habit, todayISO());
  }
  updateProgressIndicator();
  await saveState();
}

async function toggleSubDone(subId, btnEl, parentId){
  if (!state.completions[subId]) state.completions[subId]=[];
  const idx = state.completions[subId].indexOf(selectedDate);
  const willBeDone = idx===-1;
  if (willBeDone) state.completions[subId].push(selectedDate);
  else state.completions[subId].splice(idx,1);
  btnEl.classList.toggle('done', willBeDone);

  const habit = state.habits.find(h=>h.id===parentId);
  const group = btnEl.closest('.habit-group');
  if (habit && group){
    const active = activeSubsFor(habit, selectedDate);
    const doneCount = active.filter(s=>isSubCompleted(s.id, selectedDate)).length;
    const fractionEl = group.querySelector('.group-fraction');
    if (fractionEl) fractionEl.textContent = `${doneCount}/${active.length}`;
    const headerCheck = group.querySelector('.group-header .check-circle');
    if (headerCheck) headerCheck.classList.toggle('done', active.length>0 && doneCount===active.length);
    const streakEl = group.querySelector('.habit-streak .num');
    if (streakEl && selectedDate===todayISO()) streakEl.textContent = getCurrentStreak(habit, todayISO());
  }
  updateProgressIndicator();
  await saveState();
}

async function toggleGroupAll(habitId, btnEl){
  const habit = state.habits.find(h=>h.id===habitId);
  const active = activeSubsFor(habit, selectedDate);
  const allDone = active.length>0 && active.every(s=>isSubCompleted(s.id, selectedDate));
  active.forEach(s=>{
    if (!state.completions[s.id]) state.completions[s.id]=[];
    const idx = state.completions[s.id].indexOf(selectedDate);
    if (allDone){ if(idx!==-1) state.completions[s.id].splice(idx,1); }
    else { if(idx===-1) state.completions[s.id].push(selectedDate); }
  });
  renderToday();
  await saveState();
}

function navDate(delta){
  const newDate = addDays(selectedDate, delta);
  if (newDate > todayISO()) return;
  selectedDate = newDate;
  renderToday();
}

/* ---------- Rendering: Übersicht ---------- */
function renderDashboard(){
  const el = document.getElementById('dashboard-screen');
  if (state.habits.length===0){
    el.innerHTML = `
      <div class="date-row"><div class="date-title">Übersicht</div></div>
      <div class="empty-state">
        <h3>Noch keine Daten</h3>
        <p>Sobald du Gewohnheiten anlegst und abhakst, siehst du hier Serien und Trends.</p>
      </div>`;
    return;
  }
  const today = todayISO();
  const rates = state.habits.map(h=>getCompletionRate(h,30));
  const avgRate = Math.round(rates.reduce((a,b)=>a+b,0)/rates.length);
  const bestStreak = Math.max(...state.habits.map(h=>getCurrentStreak(h,today)));

  let html = `
    <div class="date-row"><div class="date-title">Übersicht</div></div>
    <div class="summary-row">
      <div class="summary-box"><div class="n">${state.habits.length}</div><div class="l">Gewohnh.</div></div>
      <div class="summary-box"><div class="n">${bestStreak}</div><div class="l">Beste Serie</div></div>
      <div class="summary-box"><div class="n">${avgRate}%</div><div class="l">Ø 30 Tage</div></div>
    </div>
  `;

  state.habits.forEach(h=>{
    const cur = getCurrentStreak(h,today);
    const longest = getLongestStreak(h,today);
    const rate = getCompletionRate(h,30);
    const heat = getHeatmapData(h,28,today);
    let subBreakdown = '';
    if (hasSubHabits(h)){
      subBreakdown = `<div class="sub-breakdown">${h.subHabits.map(s=>{
        const vs = virtualSubHabit(h,s);
        const sStreak = getCurrentStreak(vs, today);
        return `<div class="sub-breakdown-row"><span>${escapeHtml(s.name)}</span><span class="sub-breakdown-streak">${sStreak} T.</span></div>`;
      }).join('')}</div>`;
    }
    html += `
      <div class="habit-card" style="--c:${h.color}" onclick="openHabitSheet('${h.id}')">
        <div class="habit-card-head">
          <span class="dot" style="--c:${h.color}"></span>
          <span class="habit-card-title">${escapeHtml(h.name)}</span>
          <span class="habit-card-sub">${intervalLabel(h)}</span>
        </div>
        <div class="habit-card-stats">
          <div class="stat"><div class="n">${cur}</div><div class="l">Serie</div></div>
          <div class="stat"><div class="n">${longest}</div><div class="l">Rekord</div></div>
          <div class="stat"><div class="n">${rate}%</div><div class="l">30 Tage</div></div>
        </div>
        <div class="heatmap">${heat.map(s=>`<div class="heat-cell ${s}" style="--c:${h.color}"></div>`).join('')}</div>
        ${subBreakdown}
      </div>`;
  });

  html += `<div class="reset-zone" id="dataZone">${dataZoneHtml()}</div>`;
  el.innerHTML = html;
}
function dataZoneHtml(){
  if (importPendingData){
    const n = (importPendingData.habits||[]).length;
    return `
      <p class="delete-warning">Sicherung mit ${n} Gewohnheit(en) gefunden. Die aktuellen Daten auf diesem Gerät werden dabei überschrieben.</p>
      <button class="btn-danger small" onclick="confirmImport()">Ja, importieren</button>
      <button class="btn-secondary small" onclick="cancelImport()" style="margin-top:8px;">Abbrechen</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this.files[0])">`;
  }
  if (resetConfirmPending){
    return `
      <p class="delete-warning">Wirklich alle Gewohnheiten und Einträge löschen?</p>
      <button class="btn-danger small" onclick="resetAllData()">Ja, alles löschen</button>
      <button class="btn-secondary small" onclick="toggleResetConfirm()" style="margin-top:8px;">Abbrechen</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this.files[0])">`;
  }
  return `
    <div class="data-links">
      <button class="link-neutral" onclick="exportData()">Sicherung exportieren</button>
      <button class="link-neutral" onclick="triggerImport()">Sicherung importieren</button>
    </div>
    ${importError ? `<p class="delete-warning" style="color:var(--clay);margin:0 0 10px;">${escapeHtml(importError)}</p>` : ''}
    <button class="link-danger" onclick="toggleResetConfirm()">Alle Daten zurücksetzen</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this.files[0])">`;
}
function refreshDataZone(){
  const zone = document.getElementById('dataZone');
  if (zone) zone.innerHTML = dataZoneHtml();
}
function toggleResetConfirm(){
  resetConfirmPending = !resetConfirmPending;
  refreshDataZone();
}
async function resetAllData(){
  state.habits = []; state.completions = {}; resetConfirmPending = false;
  render();
  await saveState();
}

/* ---------- Sicherung: Export / Import ---------- */
function exportData(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gewohnheiten-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function triggerImport(){
  const input = document.getElementById('importFileInput');
  if (input) input.click();
}
function handleImportFile(file){
  importError = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.habits) || typeof parsed.completions !== 'object' || parsed.completions===null){
        throw new Error('unerwartete Struktur');
      }
      importPendingData = parsed;
      refreshDataZone();
    } catch(err){
      importError = 'Diese Datei sieht nicht wie eine gültige Sicherung aus.';
      importPendingData = null;
      refreshDataZone();
    }
  };
  reader.readAsText(file);
  const input = document.getElementById('importFileInput');
  if (input) input.value = '';
}
async function confirmImport(){
  if (!importPendingData) return;
  state.habits = importPendingData.habits || [];
  state.completions = importPendingData.completions || {};
  importPendingData = null;
  render();
  await saveState();
}
function cancelImport(){
  importPendingData = null;
  refreshDataZone();
}

/* ---------- Navigation ---------- */
function switchView(v){
  currentView = v;
  if (v==='today') selectedDate = todayISO();
  document.getElementById('tabToday').classList.toggle('active', v==='today');
  document.getElementById('tabDash').classList.toggle('active', v==='dashboard');
  document.getElementById('today-screen').classList.toggle('hidden', v!=='today');
  document.getElementById('dashboard-screen').classList.toggle('hidden', v!=='dashboard');
  render();
}
function render(){
  if (currentView==='today') renderToday(); else renderDashboard();
}

/* ---------- Gewohnheit anlegen/bearbeiten (Sheet) ---------- */
function openHabitSheet(habitId){
  deleteConfirmPending = false;
  if (habitId){
    const h = state.habits.find(x=>x.id===habitId);
    formHabit = JSON.parse(JSON.stringify(h));
    formHabit.subHabits = formHabit.subHabits || []; // Abwärtskompatibilität mit älteren Gewohnheiten
    editingHabitId = habitId;
  } else {
    formHabit = { id:null, name:'', color:HABIT_COLORS[state.habits.length % HABIT_COLORS.length], intervalType:'daily', weekdays:[1,2,3,4,5], everyNDays:2, timesPerWeek:3, subHabits:[] };
    editingHabitId = null;
  }
  renderSheet();
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); }

function renderSheet(){
  const sheet = document.getElementById('habitSheet');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${editingHabitId ? 'Gewohnheit bearbeiten' : 'Neue Gewohnheit'}</div>
      <button class="icon-btn" onclick="closeSheet()" aria-label="Schließen">${ICON_CLOSE}</button>
    </div>
    <label class="field-label">Name</label>
    <input id="nameInput" class="text-input" type="text" placeholder="z. B. Gesundes Essen" value="${escapeAttr(formHabit.name)}" oninput="formHabit.name=this.value" maxlength="40">

    <label class="field-label">Farbe</label>
    <div class="swatches" id="swatches">
      ${HABIT_COLORS.map(c=>`<button type="button" class="swatch ${c===formHabit.color?'selected':''}" style="--c:${c}" onclick="selectColor('${c}', this)"></button>`).join('')}
    </div>

    <label class="field-label">Rhythmus</label>
    <div class="segmented" id="segmented">
      ${INTERVAL_TYPES.map(t=>`<button type="button" class="seg-btn ${t.key===formHabit.intervalType?'active':''}" onclick="selectIntervalType('${t.key}')">${t.label}</button>`).join('')}
    </div>
    <div id="intervalFields">${renderIntervalFields()}</div>

    <label class="field-label">Untergewohnheiten <span class="optional">(optional)</span></label>
    <div class="sub-section">
      <div class="sub-list" id="subList">${renderSubListItems()}</div>
      <div class="sub-add-row">
        <input id="subInput" class="text-input" type="text" placeholder="z. B. 3 L Wasser" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();addSubHabit();}">
        <button type="button" class="add-sub-btn" onclick="addSubHabit()" aria-label="Untergewohnheit hinzufügen">+</button>
      </div>
      <p class="field-hint" id="subHint" style="margin-top:10px;">${subHintText()}</p>
    </div>

    <div class="sheet-actions" id="sheetActions"></div>
  `;
  renderSheetActions();
}
function renderIntervalFields(){
  switch(formHabit.intervalType){
    case 'daily': return `<p class="field-hint">Jeden Tag fällig.</p>`;
    case 'weekdays': {
      const order=[1,2,3,4,5,6,0];
      return `<div class="weekday-pills">${order.map(d=>`<button type="button" class="pill ${formHabit.weekdays.includes(d)?'active':''}" onclick="toggleWeekday(${d}, this)">${WEEKDAY_NAME[d]}</button>`).join('')}</div>`;
    }
    case 'everyNDays': return `
      <div class="number-field"><span>Alle</span><input type="number" min="2" max="60" value="${formHabit.everyNDays}" oninput="formHabit.everyNDays=parseInt(this.value)||2"><span>Tage</span></div>`;
    case 'timesPerWeek': return `
      <div class="number-field"><input type="number" min="1" max="7" value="${formHabit.timesPerWeek}" oninput="formHabit.timesPerWeek=parseInt(this.value)||1"><span>mal pro Woche</span></div>`;
  }
}
function selectColor(c, btn){
  formHabit.color = c;
  document.querySelectorAll('#swatches .swatch').forEach(el=>el.classList.remove('selected'));
  btn.classList.add('selected');
}
function selectIntervalType(key){
  formHabit.intervalType = key;
  document.getElementById('segmented').innerHTML = INTERVAL_TYPES.map(t=>`<button type="button" class="seg-btn ${t.key===formHabit.intervalType?'active':''}" onclick="selectIntervalType('${t.key}')">${t.label}</button>`).join('');
  document.getElementById('intervalFields').innerHTML = renderIntervalFields();
}
function toggleWeekday(d, btn){
  const idx = formHabit.weekdays.indexOf(d);
  if (idx===-1) formHabit.weekdays.push(d); else formHabit.weekdays.splice(idx,1);
  btn.classList.toggle('active');
}

/* ---------- Untergewohnheiten im Formular ---------- */
function subHintText(){
  return formHabit.subHabits.length>0
    ? 'Diese Punkte teilen sich den Rhythmus der Hauptgewohnheit oben.'
    : 'Ohne Untergewohnheiten ist dies eine einzelne Gewohnheit.';
}
function renderSubListItems(){
  return formHabit.subHabits.map(s=>`
    <div class="sub-chip">
      <span>${escapeHtml(s.name)}</span>
      <button type="button" onclick="removeSubHabit('${s.id}')" aria-label="${escapeAttr(s.name)} entfernen">×</button>
    </div>`).join('');
}
function renderSubList(){
  document.getElementById('subList').innerHTML = renderSubListItems();
  const hint = document.getElementById('subHint');
  if (hint) hint.textContent = subHintText();
}
function addSubHabit(){
  const input = document.getElementById('subInput');
  const name = input.value.trim();
  if (!name) return;
  formHabit.subHabits.push({ id:'s_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, createdDate: todayISO() });
  input.value = '';
  renderSubList();
  input.focus();
}
function removeSubHabit(id){
  formHabit.subHabits = formHabit.subHabits.filter(s=>s.id!==id);
  renderSubList();
}

function renderSheetActions(){
  const el = document.getElementById('sheetActions');
  if (deleteConfirmPending){
    el.innerHTML = `
      <p class="delete-warning">„${escapeHtml(formHabit.name||'Diese Gewohnheit')}" inkl. aller Einträge endgültig löschen?</p>
      <button class="btn-danger" onclick="deleteHabit()">Ja, löschen</button>
      <button class="btn-secondary" onclick="cancelDeleteConfirm()">Abbrechen</button>`;
  } else {
    el.innerHTML = `
      <button class="btn-primary" onclick="saveHabit()">Speichern</button>
      ${editingHabitId ? `<button class="btn-danger" onclick="confirmDelete()">Löschen</button>` : ''}`;
  }
}
function confirmDelete(){ deleteConfirmPending = true; renderSheetActions(); }
function cancelDeleteConfirm(){ deleteConfirmPending = false; renderSheetActions(); }

async function saveHabit(){
  if (!formHabit.name || !formHabit.name.trim()){
    const input = document.getElementById('nameInput');
    input.focus(); input.classList.add('shake');
    setTimeout(()=>input.classList.remove('shake'),400);
    return;
  }
  if (formHabit.intervalType==='weekdays' && formHabit.weekdays.length===0){
    const wp = document.querySelector('#intervalFields .weekday-pills');
    if (wp){ wp.classList.add('shake'); setTimeout(()=>wp.classList.remove('shake'),400); }
    return;
  }
  if (editingHabitId){
    const idx = state.habits.findIndex(h=>h.id===editingHabitId);
    const original = state.habits[idx];
    const originalSubIds = (original.subHabits||[]).map(s=>s.id);
    const newSubIds = (formHabit.subHabits||[]).map(s=>s.id);
    originalSubIds.filter(id=>!newSubIds.includes(id)).forEach(id=>{ delete state.completions[id]; });
    state.habits[idx] = {...original, ...formHabit};
  } else {
    formHabit.id = 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    formHabit.createdDate = todayISO();
    state.habits.push(formHabit);
  }
  closeSheet();
  render();
  await saveState();
}
async function deleteHabit(){
  const habit = state.habits.find(h=>h.id===editingHabitId);
  if (habit && hasSubHabits(habit)) habit.subHabits.forEach(s=>{ delete state.completions[s.id]; });
  state.habits = state.habits.filter(h=>h.id!==editingHabitId);
  delete state.completions[editingHabitId];
  closeSheet();
  render();
  await saveState();
}

/* ---------- Start ---------- */
async function init(){
  await loadState();
  render();
}
init();
</script>
</body>
</html>
